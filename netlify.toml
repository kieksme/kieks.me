[build]
  publish = "dist"
  command = "pnpm run build"
[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[redirects]]
  from = "/contact"
  to = "/kontakt"
  status = 301
[[redirects]]
  from = "/terms"
  to = "/agb"
  status = 301
